[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laptop-guard"
version = "11.1.0"
description = "Owner-controlled laptop security guard with Telegram/Bale dashboard, live security chat/notepad, native Linux screen evidence, intrusion countdown lockdown, offline history, voice intercom and safe desktop controls"
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "httpx[socks]>=0.28,<1",
  "opencv-python>=4.13,<5",
  "pynput>=1.7",
  "rich>=13.9",
  "psutil>=6,<8",
  "pyudev>=0.24,<1",
  "evdev>=1.7,<2",
  "Pillow>=10,<13",
  "py-persian-tts==3.0.2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[project.scripts]
laptop-guard = "laptop_guard.cli:main"

[tool.setuptools.packages.find]
include = ["laptop_guard*"]

[tool.setuptools.package-data]
laptop_guard = [
  "assets/*.mp4",
  "assets/warnings/*.mp4",
  "assets/warnings/*.png",
]
