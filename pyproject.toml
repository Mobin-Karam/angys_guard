[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laptop-guard"
version = "11.1.0"
description = "AngysGuard / Laptop Guard: owner-controlled endpoint security and device protection platform, Linux-first with Bale/Telegram controls, bounded evidence, guided setup, and a cross-platform roadmap"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
  "angysguard",
  "linux",
  "security",
  "laptop-security",
  "endpoint-security",
  "device-protection",
  "intrusion-detection",
  "monitoring",
  "telegram-bot",
  "bale",
  "opencv",
]
dependencies = [
  "requests>=2.32,<3",
  "httpx[socks]>=0.28,<1",
  "opencv-python>=4.13,<5",
  "pynput>=1.7",
  "rich>=13.9",
  "psutil>=6,<8",
  "pyudev>=0.24,<1",
  "evdev>=1.7,<2",
  "Pillow>=10,<12",
  "py-persian-tts==3.0.2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[project.scripts]
laptop-guard = "laptop_guard.cli:main"

[project.urls]
Repository = "https://github.com/Mobin-Karam/angys_guard"
Documentation = "https://github.com/Mobin-Karam/angys_guard/tree/main/docs"
Issues = "https://github.com/Mobin-Karam/angys_guard/issues"
Changelog = "https://github.com/Mobin-Karam/angys_guard/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["laptop_guard*"]

[tool.setuptools.package-data]
laptop_guard = [
  "assets/*.mp4",
  "assets/warnings/*.mp4",
  "assets/warnings/*.png",
]
