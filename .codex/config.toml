# Project-local Codex configuration.
# Codex loads this layer only when the repository is trusted.

project_doc_max_bytes = 65536
project_doc_fallback_filenames = ["AGENT.md"]

[agents]
enabled = true
max_concurrent_threads_per_session = 4
interrupt_message = true

[agents.navigator]
description = "Read-only Graphify-first repository navigator for ownership, callers, dependencies, tests, docs, and impact mapping."
config_file = "agents/navigator.toml"

[agents.architect]
description = "Read-only architecture planner for cross-module or security-sensitive changes; consumes Graphify navigation first."
config_file = "agents/architect.toml"

[agents.implementer]
description = "Focused implementation agent that follows the agreed graph-backed change boundary and adds tests."
config_file = "agents/implementer.toml"

[agents.reviewer]
description = "Read-only correctness and regression reviewer; uses Graphify for impact/caller/test discovery before broad reads."
config_file = "agents/reviewer.toml"

[agents.security_reviewer]
description = "Read-only reviewer for authorization, privacy, secrets, remote control, capture boundaries, and graph-backed impact tracing."
config_file = "agents/security_reviewer.toml"

[agents.tester]
description = "Verification specialist for Graphify-guided test discovery, targeted tests, full checks, and failure triage."
config_file = "agents/tester.toml"

[agents.release_manager]
description = "Release-readiness specialist for changelog, support matrix, CI, release checklists, graph freshness, and repository-presentation readiness."
config_file = "agents/release_manager.toml"

[agents.repository_curator]
description = "Repository presentation maintainer for README, About metadata, version/release references, documentation navigation, and overview visuals."
config_file = "agents/repository_curator.toml"

[agents.product_planner]
description = "Read-only AngysGuard product/platform planner for current-vs-future support, apps, control modes, milestones/issues, and roadmap consistency."
config_file = "agents/product_planner.toml"
