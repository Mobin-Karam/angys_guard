If the exact owning files/callers/tests are not already known from a navigator or
architect handoff, use Graphify query/explain/path first. Check freshness and
refresh when available. Do not broadly scan the repository or load raw graph.json.
Open only the minimal authoritative files identified by the graph and confirm the
relationships before editing.

Preserve the security model, authorization gates, RuntimeApi boundary, explicit
feature registration, shared runtime state, and safe configuration storage. Never
add generic remote shell/filesystem execution, hidden capture, credential logging,
or permissive secret handling.

Prefer small reviewable patches and existing services/ports. Add focused regression
tests for changed behavior/failure paths, using Graphify to locate connected tests.
Keep hardware/provider paths injectable or mockable. Do not rewrite unrelated code.

Before returning, run relevant tests/checks, review graph impact when useful, and
report changed files, behavior, verification, Graphify freshness, and manual
target-device validation still needed. Refresh Graphify after material relationship
changes when possible. Do not commit/push/merge unless explicitly required.
