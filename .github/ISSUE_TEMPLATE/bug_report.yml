name: Bug / regression
description: Report a reproducible AngysGuard defect or regression
title: "[BUG] "
labels:
  - type:bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an AngysGuard problem.

        **Do not post credentials, bot tokens, chat IDs, OS passwords, private keys, captured evidence, private screenshots/recordings, or other sensitive data.** If this is a security vulnerability, use the private security-reporting path from the issue chooser instead of this form.

  - type: input
    id: version
    attributes:
      label: AngysGuard / Laptop Guard version
      description: Use the installed/released version or commit SHA when running from source.
      placeholder: "Example: 11.1.0 or commit abc1234"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Example: Ubuntu 26.04, Fedora 43"
    validations:
      required: true

  - type: dropdown
    id: session
    attributes:
      label: Desktop / session
      options:
        - GNOME / Wayland
        - GNOME / X11
        - KDE / Wayland
        - KDE / X11
        - Other Linux desktop/session
        - Headless / service-only
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected area
      options:
        - Startup / runtime
        - Installation / setup / doctor
        - Monitoring / intrusion response
        - Camera
        - Screen capture
        - Input activity
        - Audio / microphone / TTS
        - Bale / Telegram / provider
        - Local API / owner controls
        - Warning / lock / system action
        - Service / autostart
        - Events / storage / outbox
        - Local UI / chat surface
        - Other / unsure
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Describe the observed behavior and the smallest useful context.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal steps to reproduce
      placeholder: |
        1. Run ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Reproduction frequency
      options:
        - Every time
        - Often
        - Sometimes
        - Happened once
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: Is this a regression?
      options:
        - "Yes"
        - "No"
        - Unknown
    validations:
      required: true

  - type: input
    id: last_working
    attributes:
      label: Last known working version / commit
      placeholder: "Leave blank if unknown"

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Run `./run.sh doctor` first. For an unexpected software defect, you may copy only the smallest relevant record from `~/.local/share/laptop-guard/logs/runtime-diagnostics.jsonl` after manually removing usernames/home paths, hostnames, IP addresses, device names, chat IDs, and other identifying data. Never paste `secrets.json`, `stop-pin.json`, raw event databases, Authorization headers, tokens, passwords, private keys, or captured camera/screen/audio evidence. See `docs/RELEASE_CHECKLIST.md` section "Sanitized diagnostics for bug reports".
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Hardware/backend details, workaround, or other non-sensitive information that may help reproduce the problem.

  - type: checkboxes
    id: checks
    attributes:
      label: Reporter checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I reviewed diagnostics manually and removed credentials, tokens, Authorization headers, chat IDs, usernames/paths, hostnames/IPs, OS passwords, private media/evidence, and other sensitive or identifying data.
          required: true
        - label: This is a normal bug report, not a vulnerability requiring private disclosure.
          required: true
