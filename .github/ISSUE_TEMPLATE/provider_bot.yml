name: Bale / Telegram / bot-control problem
description: Report owner-control, provider, pairing, delivery, or bot-command problems
title: "[PROVIDER] "
labels:
  - type:bug
  - area:provider
body:
  - type: markdown
    attributes:
      value: |
        Use this for provider-specific behavior: Bale, Telegram-style transport, pairing, command delivery, replies, media delivery, or authorization behavior.

        **Never post a real bot token, chat ID, pairing credential, OS password, private message, captured evidence, webhook secret, or private key.**

  - type: dropdown
    id: provider
    attributes:
      label: Provider / control surface
      options:
        - Bale
        - Telegram / Telegram-style provider
        - Local-only / local API
        - Unsure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "Example: 11.1.0 or commit abc1234"
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command / action affected
      placeholder: "Example: /status, /photo, pairing, notification delivery"
    validations:
      required: true

  - type: dropdown
    id: state
    attributes:
      label: Owner/pairing state
      options:
        - Provider configured and owner paired
        - Provider configured but pairing incomplete
        - Setup/validation fails before pairing
        - Previously worked, now broken
        - Unknown
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      placeholder: |
        1. Configure provider ...
        2. Send/trigger ...
        3. Observe ...
    validations:
      required: true

  - type: dropdown
    id: network
    attributes:
      label: Network / proxy context
      options:
        - Direct connection
        - HTTP/HTTPS proxy
        - SOCKS proxy
        - VPN / filtered network
        - Unknown / not relevant
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized provider diagnostics
      description: Include only relevant error/status text with tokens, IDs, usernames, messages, media, URLs containing secrets, and other private data removed.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Reporter checklist
      options:
        - label: I confirmed this is not a general installation/runtime problem better suited to another template.
          required: true
        - label: I removed all tokens, chat IDs, pairing credentials, OS passwords, private messages/media/evidence, and other sensitive data.
          required: true
