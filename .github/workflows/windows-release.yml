name: Desktop test release

on:
  workflow_dispatch:
  push:
    tags: ["linux-v*", "windows-v*"]

permissions:
  contents: write

jobs:
  windows-package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/windows-v')
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop/windows-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/windows-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Build installable Windows artifacts
        run: npm run tauri build -- --bundles nsis,msi
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AngysGuard-Windows-installers
          path: |
            desktop/windows-tauri/src-tauri/target/release/bundle/nsis/*.exe
            desktop/windows-tauri/src-tauri/target/release/bundle/msi/*.msi
      - name: Create GitHub prerelease for a version tag
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            desktop/windows-tauri/src-tauri/target/release/bundle/nsis/*.exe
            desktop/windows-tauri/src-tauri/target/release/bundle/msi/*.msi

  linux-package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/linux-v')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop/windows-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/windows-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install bundled Linux runtime build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ../.. pyinstaller
      - name: Install Linux desktop packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install frontend dependencies
        run: npm ci
      - name: Build installable Linux artifacts
        run: npm run tauri build -- --bundles deb,appimage
      - name: Upload Linux installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AngysGuard-Linux-installers
          path: |
            desktop/windows-tauri/src-tauri/target/release/bundle/deb/*.deb
            desktop/windows-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Generate Linux artifact checksums
        if: startsWith(github.ref, 'refs/tags/linux-v')
        run: |
          cd src-tauri/target/release/bundle
          sha256sum deb/*.deb appimage/*.AppImage > SHA256SUMS
      - name: Create GitHub prerelease for a Linux version tag
        if: startsWith(github.ref, 'refs/tags/linux-v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            desktop/windows-tauri/src-tauri/target/release/bundle/deb/*.deb
            desktop/windows-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/windows-tauri/src-tauri/target/release/bundle/SHA256SUMS
