name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install -r server/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q laptop_guard tests server

      - name: Run tests
        env:
          PYTHONUNBUFFERED: "1"
          DISPLAY: ""
        run: python -m pytest -q

  release-gate:
    name: Release gate
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require supported-Python test matrix
        env:
          TEST_RESULT: ${{ needs.test.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$TEST_RESULT" = "success" || {
            echo "Release gate blocked because one or more supported-Python test jobs failed."
            exit 1
          }
