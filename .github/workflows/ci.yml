name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install -r server/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q laptop_guard tests server

      - name: Run tests
        env:
          PYTHONUNBUFFERED: "1"
          DISPLAY: ""
        run: python -m pytest -q

  desktop:
    name: Desktop source build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop/windows-tauri

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/windows-tauri/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Test the native desktop agent
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build the RTL desktop interface
        run: npm run build

  release-gate:
    name: Release gate
    needs: [test, desktop]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require supported-Python test matrix
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$TEST_RESULT" = "success" || {
            echo "Release gate blocked because one or more supported-Python test jobs failed."
            exit 1
          }
          test "$DESKTOP_RESULT" = "success" || {
            echo "Release gate blocked because the desktop source build failed."
            exit 1
          }
