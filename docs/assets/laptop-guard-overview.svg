<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">AngysGuard overview</title>
  <desc id="desc">AngysGuard, Angel of System Guard: owner-controlled Linux security today with planned Windows and Android expansion, bounded evidence, visible response, and constrained owner controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a18"/>
      <stop offset="0.52" stop-color="#0b2b27"/>
      <stop offset="1" stop-color="#123f38"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <style>
      .title { font: 700 62px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; letter-spacing: -1.5px; }
      .subtitle { font: 400 26px Inter, ui-sans-serif, system-ui, sans-serif; fill: #b8d8d2; }
      .card-title { font: 700 24px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .card-copy { font: 400 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #b8d8d2; }
      .chip { font: 600 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #d7f5ef; }
      .small { font: 500 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #9fc7c0; }
    </style>
  </defs>

  <rect width="1440" height="720" rx="34" fill="url(#bg)"/>
  <circle cx="1260" cy="80" r="250" fill="#2dd4bf" opacity="0.055"/>
  <circle cx="170" cy="680" r="270" fill="#10b981" opacity="0.045"/>

  <g transform="translate(86 70)">
    <g filter="url(#shadow)">
      <path d="M74 4 138 27v55c0 52-26 91-64 111C36 173 10 134 10 82V27L74 4Z" fill="url(#shield)"/>
      <path d="m46 87 18 18 39-45" fill="none" stroke="#ecfdf5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="170" y="62" class="title">AngysGuard</text>
    <text x="170" y="108" class="subtitle">Angel of System Guard · owner-controlled device security</text>
    <text x="170" y="145" class="small">Linux today · Windows + Android planned · self-hosted or managed owner control</text>
  </g>

  <g transform="translate(74 278)">
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="292" height="230" rx="24" fill="#0d3530" stroke="#1d5b52"/>
      <circle cx="42" cy="44" r="18" fill="#16a34a" opacity="0.2"/>
      <path d="M34 44h16M42 36v16" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round"/>
      <text x="76" y="52" class="card-title">Detect</text>
      <text x="28" y="96" class="card-copy">Input activity</text>
      <text x="28" y="128" class="card-copy">Camera motion / presence</text>
      <text x="28" y="160" class="card-copy">Readable auth failures</text>
      <text x="28" y="192" class="card-copy">USB / system health signals</text>
    </g>

    <path d="M305 115h44" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
    <path d="m341 105 12 10-12 10" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(365 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="292" height="230" rx="24" fill="#0d3530" stroke="#1d5b52"/>
      <circle cx="42" cy="44" r="18" fill="#0ea5e9" opacity="0.18"/>
      <path d="M33 44h18M42 35v18" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
      <text x="76" y="52" class="card-title">Verify &amp; record</text>
      <text x="28" y="96" class="card-copy">Bounded camera / screen evidence</text>
      <text x="28" y="128" class="card-copy">Local event history + outbox</text>
      <text x="28" y="160" class="card-copy">Visible privacy-aware capture</text>
      <text x="28" y="192" class="card-copy">Shared runtime state</text>
    </g>

    <path d="M670 115h44" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
    <path d="m706 105 12 10-12 10" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(730 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="292" height="230" rx="24" fill="#0d3530" stroke="#1d5b52"/>
      <circle cx="42" cy="44" r="18" fill="#f59e0b" opacity="0.18"/>
      <path d="M42 33v13M42 54v1" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
      <text x="76" y="52" class="card-title">Respond</text>
      <text x="28" y="96" class="card-copy">Visible warning</text>
      <text x="28" y="128" class="card-copy">Owner notification</text>
      <text x="28" y="160" class="card-copy">Lock / safe OS actions</text>
      <text x="28" y="192" class="card-copy">Fail-closed authorization</text>
    </g>

    <path d="M1035 115h44" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
    <path d="m1071 105 12 10-12 10" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(1095 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="272" height="230" rx="24" fill="#0d3530" stroke="#1d5b52"/>
      <circle cx="42" cy="44" r="18" fill="#8b5cf6" opacity="0.2"/>
      <path d="M32 45c7-10 13-10 20 0M36 52h12" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
      <text x="76" y="52" class="card-title">Owner control</text>
      <text x="28" y="96" class="card-copy">Bale / Telegram</text>
      <text x="28" y="128" class="card-copy">Local + future apps</text>
      <text x="28" y="160" class="card-copy">Self-hosted or managed</text>
      <text x="28" y="192" class="card-copy">Device-scoped authorization</text>
    </g>
  </g>

  <g transform="translate(80 558)">
    <rect x="0" y="0" width="1280" height="92" rx="22" fill="#092823" stroke="#174d45"/>
    <text x="28" y="34" class="small">SECURITY BOUNDARIES</text>
    <g transform="translate(28 50)">
      <rect width="180" height="28" rx="14" fill="#123e37"/><text x="15" y="20" class="chip">No remote shell</text>
      <g transform="translate(194 0)"><rect width="160" height="28" rx="14" fill="#123e37"/><text x="15" y="20" class="chip">No keylogging</text></g>
      <g transform="translate(368 0)"><rect width="210" height="28" rx="14" fill="#123e37"/><text x="15" y="20" class="chip">Bounded capture</text></g>
      <g transform="translate(592 0)"><rect width="220" height="28" rx="14" fill="#123e37"/><text x="15" y="20" class="chip">Owner authorization</text></g>
      <g transform="translate(826 0)"><rect width="190" height="28" rx="14" fill="#123e37"/><text x="15" y="20" class="chip">No OS password cloud</text></g>
      <g transform="translate(1030 0)"><rect width="220" height="28" rx="14" fill="#123e37"/><text x="15" y="20" class="chip">Platform-native actions</text></g>
    </g>
  </g>

  <text x="80" y="690" class="small">Python 3.11+ · Linux reference platform · guided setup &amp; doctor · Graphify-first engineering</text>
</svg>
