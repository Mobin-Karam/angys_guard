# Include inside the existing HTTPS server block for api.mahakaram.ir after
# installing nginx-http-rate-limit.conf at the Nginx http context. TLS certificate
# directives stay in the host's existing certificate management.

client_max_body_size 16k;

location /v1/accounts {
    limit_req zone=angysguard_auth burst=5 nodelay;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location /v1/sessions {
    limit_req zone=angysguard_auth burst=5 nodelay;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
